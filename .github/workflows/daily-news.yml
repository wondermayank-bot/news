name: Daily news (6 PM IST)

on:
  schedule:
    # GitHub cron is UTC. 12:30 UTC = 18:00 IST. GitHub can start scheduled runs a few minutes late.
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      posts:
        description: "How many stories to publish (blank = default)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch news, write stories with OpenRouter, rebuild site and sitemap
        id: news
        run: node scripts/12-1-2026.js
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          POSTS_PER_RUN: ${{ github.event.inputs.posts }}

      - name: Commit and push (Cloudflare Pages deploys from this push)
        if: steps.news.outputs.new_posts != '0'
        run: |
          git config user.name "thunder-news-bot"
          git config user.email "thunder-news-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "news: $(TZ=Asia/Kolkata date +%F) daily stories (${{ steps.news.outputs.new_posts }} new)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Tell Bing and others about the new pages (IndexNow, optional)
        if: steps.news.outputs.new_posts != '0'
        run: |
          sleep 120   # give Cloudflare Pages time to deploy
          node scripts/indexnow.js
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
