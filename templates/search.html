<section class="hero list-hero">
<span class="blob blob-1"></span><span class="blob blob-2"></span>
<div class="wrap">
<span class="hero-badge"><span class="hero-dot"></span>Search</span>
<h1>Search the <span class="accent">news</span></h1>
<p class="hero-sub">Search every story on ThunderStudy News by headline, topic or keyword.</p>
</div>
</section>
<section class="sec list-sec" id="searchApp">
<div class="wrap">
<form class="search-form" role="search" action="/search/" method="get">
<label class="sr-only" for="q">Search stories</label>
<input class="sinput" id="q" name="q" type="search" placeholder="Try: CUET, budget, cricket, NEET" autocomplete="off" autofocus>
<button class="btn btn-primary" type="submit">{{icSearch}}Search</button>
</form>
<p class="ds-note search-status" id="qStatus" aria-live="polite">Type to search {{count}} stories.</p>
<div class="grid-3 news-grid" id="qResults"></div>
<noscript><p>Search needs JavaScript. You can still browse the <a class="text-link" href="/archive/">full archive</a>.</p></noscript>
</div>
</section>
