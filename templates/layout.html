<!DOCTYPE html>
<html lang="{{lang}}" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="robots" content="{{robots}}">
<meta name="theme-color" id="metaTheme" content="#70A1FC">
<meta name="color-scheme" id="metaScheme" content="light">
<meta name="supported-color-schemes" content="light">
<meta name="darkreader-lock">
<meta name="author" content="{{siteName}}">
<meta name="format-detection" content="telephone=no">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:type" content="{{ogType}}">
<meta property="og:title" content="{{ogTitle}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{locale}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ogAlt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="{{twitter}}">
<meta name="twitter:title" content="{{ogTitle}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{ogImage}}">
{{headExtra}}
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="alternate" type="application/rss+xml" title="{{siteName}} RSS" href="/rss.xml">
<link rel="alternate" type="application/feed+json" title="{{siteName}} JSON Feed" href="/feed.json">
<link rel="sitemap" type="application/xml" href="/sitemap.xml">
<script>
/* Theme is only ever 'light' (blue) or 'dark' (purple), from the saved choice, never from the system setting. */
(function(){var t='light';try{var s=localStorage.getItem('theme');if(s==='dark'||s==='light')t=s;}catch(e){}
var d=document.documentElement;d.setAttribute('data-theme',t);d.classList.add('js');
var m=document.getElementById('metaTheme');if(m)m.setAttribute('content',t==='dark'?'#9A7AFB':'#70A1FC');
var c=document.getElementById('metaScheme');if(c)c.setAttribute('content',t);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v={{cssV}}">
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body class="{{bodyClass}}">
<a class="skip-link" href="#main">Skip to content</a>
<div id="loader" aria-hidden="true"><div class="loader-blob"></div></div>
{{icons}}
{{header}}
<main id="main">
{{content}}
</main>
{{footer}}
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/assets/app.js?v={{jsV}}" defer></script>
</body>
</html>
